<!doctype html>
<html lang="en" data-theme="light" data-mode="frosted">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTM Go Student Action Card Contrast Options</title>
  <style>
    :root {
      color-scheme: light;
      --utm-maroon: #800000;
      --utm-maroon-deep: #5f0808;
      --utm-maroon-soft: rgba(128, 0, 0, 0.12);
      --utm-gold: #c8a34a;
      --utm-gold-soft: rgba(200, 163, 74, 0.18);
      --bg: #f4f4f6;
      --bg-2: #fff6f0;
      --text: #1d1d1f;
      --text-soft: #666c76;
      --text-muted: #858b96;
      --shell: rgba(255, 255, 255, 0.82);
      --scan-surface:
        linear-gradient(135deg, rgba(128, 0, 0, 0.11), rgba(200, 163, 74, 0.14) 48%, rgba(255, 255, 255, 0.28));
      --action-surface:
        linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.46));
      --action-icon: rgba(128, 0, 0, 0.09);
      --action-shadow: 0 22px 46px rgba(42, 22, 22, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --utm-maroon: #ff8a8a;
      --utm-maroon-deep: #c95d5d;
      --utm-maroon-soft: rgba(255, 138, 138, 0.12);
      --utm-gold: #e3c366;
      --utm-gold-soft: rgba(227, 195, 102, 0.12);
      --bg: #07080b;
      --bg-2: #241317;
      --text: #f5f5f7;
      --text-soft: #c3c7d0;
      --text-muted: #9198a6;
      --shell: rgba(31, 34, 43, 0.76);
      --scan-surface:
        linear-gradient(135deg, rgba(255, 138, 138, 0.12), rgba(227, 195, 102, 0.1) 48%, rgba(255, 255, 255, 0.05));
      --action-surface:
        linear-gradient(135deg, rgba(31, 34, 43, 0.88), rgba(28, 25, 30, 0.72));
      --action-icon: rgba(255, 138, 138, 0.12);
      --action-shadow: 0 24px 52px rgba(0, 0, 0, 0.28);
    }

    html[data-mode="brand"] {
      --action-surface:
        linear-gradient(135deg, rgba(128, 0, 0, 0.2), rgba(200, 163, 74, 0.18) 56%, rgba(128, 0, 0, 0.08));
      --action-icon: rgba(128, 0, 0, 0.14);
      --action-shadow: 0 22px 48px rgba(128, 0, 0, 0.14);
    }

    html[data-theme="dark"][data-mode="brand"] {
      --action-surface:
        linear-gradient(135deg, rgba(255, 138, 138, 0.18), rgba(227, 195, 102, 0.12) 54%, rgba(255, 255, 255, 0.05));
      --action-icon: rgba(255, 138, 138, 0.15);
      --action-shadow: 0 24px 52px rgba(128, 0, 0, 0.24);
    }

    html[data-mode="dimmer"] {
      --action-surface:
        linear-gradient(135deg, rgba(128, 0, 0, 0.12), rgba(200, 163, 74, 0.1) 52%, rgba(128, 0, 0, 0.05));
      --action-icon: rgba(128, 0, 0, 0.11);
      --action-shadow: 0 18px 34px rgba(40, 24, 24, 0.08);
    }

    html[data-theme="dark"][data-mode="dimmer"] {
      --action-surface:
        linear-gradient(135deg, rgba(255, 138, 138, 0.1), rgba(227, 195, 102, 0.07) 54%, rgba(255, 255, 255, 0.04));
      --action-icon: rgba(255, 138, 138, 0.12);
      --action-shadow: 0 18px 36px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 14% 8%, rgba(128, 0, 0, 0.18), transparent 33rem),
        radial-gradient(circle at 88% 14%, rgba(200, 163, 74, 0.2), transparent 30rem),
        radial-gradient(circle at 64% 94%, rgba(128, 0, 0, 0.1), transparent 34rem),
        linear-gradient(135deg, var(--bg), var(--bg-2) 48%, var(--bg));
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(circle at 14% 8%, rgba(255, 138, 138, 0.2), transparent 31rem),
        radial-gradient(circle at 88% 14%, rgba(227, 195, 102, 0.13), transparent 29rem),
        radial-gradient(circle at 64% 94%, rgba(255, 138, 138, 0.13), transparent 34rem),
        linear-gradient(135deg, var(--bg), var(--bg-2) 50%, var(--bg));
    }

    html[data-mode="dimmer"] body {
      background:
        radial-gradient(circle at 14% 8%, rgba(128, 0, 0, 0.08), transparent 33rem),
        radial-gradient(circle at 88% 14%, rgba(200, 163, 74, 0.09), transparent 30rem),
        radial-gradient(circle at 64% 94%, rgba(128, 0, 0, 0.05), transparent 34rem),
        linear-gradient(135deg, var(--bg), var(--bg-2) 48%, var(--bg));
    }

    html[data-theme="dark"][data-mode="dimmer"] body {
      background:
        radial-gradient(circle at 14% 8%, rgba(255, 138, 138, 0.1), transparent 31rem),
        radial-gradient(circle at 88% 14%, rgba(227, 195, 102, 0.07), transparent 29rem),
        radial-gradient(circle at 64% 94%, rgba(255, 138, 138, 0.07), transparent 34rem),
        linear-gradient(135deg, var(--bg), var(--bg-2) 50%, var(--bg));
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid rgba(128, 0, 0, 0.34);
      outline-offset: 4px;
    }

    .page {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 24px;
    }

    .preview-toolbar {
      display: grid;
      gap: 14px;
      margin: 0 auto 22px;
      max-width: 940px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .segmented {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.46);
      backdrop-filter: blur(18px);
    }

    html[data-theme="dark"] .segmented {
      background: rgba(255, 255, 255, 0.07);
    }

    .chip {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 14px;
      background: transparent;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 850;
      transition: background 180ms ease, color 180ms ease;
    }

    .chip[aria-pressed="true"] {
      background: var(--utm-maroon);
      color: #fff;
    }

    html[data-theme="dark"] .chip[aria-pressed="true"] {
      color: #1b0b0c;
    }

    .caption {
      margin: 0;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 750;
      text-align: center;
    }

    .canvas {
      display: grid;
      place-items: start center;
      min-height: 760px;
      padding: 4px 0 28px;
    }

    .phone {
      width: min(100%, 540px);
    }

    .top-bar,
    .scan-card {
      background: var(--shell);
      backdrop-filter: blur(24px);
      box-shadow: 0 22px 48px rgba(36, 20, 24, 0.1);
    }

    html[data-theme="dark"] .top-bar,
    html[data-theme="dark"] .scan-card {
      box-shadow: 0 24px 58px rgba(0, 0, 0, 0.26);
    }

    .top-bar {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) auto auto;
      gap: 14px;
      align-items: center;
      min-height: 126px;
      padding: 26px;
      border-radius: 34px;
    }

    .logo {
      width: 58px;
      height: auto;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      overflow: hidden;
      font-size: clamp(24px, 4.8vw, 30px);
      font-weight: 950;
      letter-spacing: 0;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-name {
      margin-top: 8px;
      color: var(--text-soft);
      font-size: 17px;
      font-weight: 850;
    }

    .icon-button {
      display: grid;
      width: 70px;
      height: 70px;
      place-items: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.42);
      box-shadow: inset 0 0 0 1px rgba(100, 105, 116, 0.14);
    }

    html[data-theme="dark"] .icon-button {
      background: rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
    }

    .icon,
    .svg-icon {
      color: var(--text);
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .primary-icon {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .screen-stack {
      display: grid;
      gap: 28px;
      margin-top: 40px;
    }

    .scan-card {
      overflow: hidden;
      border-radius: 34px;
      background: var(--scan-surface);
      padding: 30px;
    }

    .eyebrow {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 900;
    }

    .scan-card h2 {
      margin-top: 30px;
      font-size: clamp(42px, 11vw, 54px);
      font-weight: 950;
      letter-spacing: 0;
      line-height: 1;
    }

    .scan-card p {
      max-width: 390px;
      margin-top: 18px;
      color: var(--text-soft);
      font-size: 22px;
      line-height: 1.35;
    }

    .primary-button {
      display: flex;
      min-height: 84px;
      margin-top: 38px;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--utm-maroon), var(--utm-maroon-deep));
      color: #fff;
      font-size: 24px;
      font-weight: 950;
      text-align: center;
    }

    html[data-theme="dark"] .primary-button {
      color: #1b0b0c;
      background: linear-gradient(135deg, #ff8a8a, #e3c366);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .action-card {
      display: grid;
      min-height: 166px;
      align-content: space-between;
      gap: 24px;
      padding: 28px;
      border-radius: 30px;
      background: var(--action-surface);
      box-shadow: var(--action-shadow);
      text-align: left;
    }

    .action-card.wide {
      grid-column: 1 / -1;
      min-height: 126px;
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: center;
      align-content: center;
    }

    .action-icon {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 18px;
      background: var(--action-icon);
      color: var(--utm-maroon);
    }

    .action-card h3 {
      font-size: clamp(24px, 5vw, 30px);
      font-weight: 950;
      letter-spacing: 0;
      line-height: 1.08;
    }

    .action-card p {
      margin-top: 8px;
      color: var(--text-soft);
      font-size: 18px;
      line-height: 1.22;
    }

    @media (min-width: 860px) {
      .canvas {
        align-items: start;
      }

      .phone {
        width: min(100%, 920px);
      }

      .screen-stack {
        grid-template-columns: minmax(330px, 1fr) minmax(330px, 1fr);
        align-items: start;
      }

      .actions {
        align-self: stretch;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 18px;
      }

      .top-bar {
        grid-template-columns: 76px minmax(0, 1fr) 58px 58px;
        min-height: 116px;
        padding: 22px;
        border-radius: 32px;
      }

      .icon-button {
        width: 58px;
        height: 58px;
        border-radius: 18px;
      }

      .logo {
        width: 54px;
      }

      .screen-stack {
        gap: 28px;
        margin-top: 38px;
      }

      .scan-card {
        padding: 26px;
      }

      .actions {
        gap: 28px;
      }

      .action-card {
        min-height: 156px;
        padding: 26px;
      }

      .action-card.wide {
        grid-template-columns: 72px minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="preview-toolbar" aria-label="Preview controls">
      <div class="toolbar-row">
        <div class="segmented" role="group" aria-label="Contrast option">
          <button class="chip" type="button" data-mode="frosted" aria-pressed="true">Frosted white cards</button>
          <button class="chip" type="button" data-mode="brand" aria-pressed="false">Brand-tinted cards</button>
          <button class="chip" type="button" data-mode="dimmer" aria-pressed="false">Dimmer background</button>
        </div>
        <div class="segmented" role="group" aria-label="Theme">
          <button class="chip" type="button" data-theme-value="light" aria-pressed="true">Light</button>
          <button class="chip" type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
      <p class="caption" id="modeCaption">Frosted white cards: stronger translucent surfaces, soft shadow, no visible border.</p>
    </section>

    <section class="canvas" aria-label="Student dashboard preview">
      <div class="phone">
        <nav class="top-bar" aria-label="Student top bar">
          <img class="logo" src="../../assets/images/utmgologonobg.png" alt="UTM Go">
          <div>
            <h1>Student workspace</h1>
            <p class="app-name">UTM Go</p>
          </div>
          <button class="icon-button" type="button" aria-label="Open profile">
            <svg class="svg-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          <button class="icon-button" type="button" aria-label="Logout">
            <svg class="svg-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <path d="m16 17 5-5-5-5"></path>
              <path d="M21 12H9"></path>
            </svg>
          </button>
        </nav>

        <div class="screen-stack">
          <article class="scan-card" aria-label="Attendance">
            <span class="eyebrow">Attendance</span>
            <h2>Scan QR</h2>
            <p>Open the scanner when your lecturer shows the attendance QR code.</p>
            <button class="primary-button" type="button">
              <svg class="primary-icon" aria-hidden="true" viewBox="0 0 24 24">
                <rect x="3" y="3" width="5" height="5"></rect>
                <rect x="16" y="3" width="5" height="5"></rect>
                <rect x="3" y="16" width="5" height="5"></rect>
                <path d="M16 16h2v2h-2z"></path>
                <path d="M21 16v5h-5"></path>
                <path d="M12 7v5h5"></path>
                <path d="M7 12h1"></path>
                <path d="M12 21v-3"></path>
              </svg>
              <span>Scan attendance QR</span>
            </button>
          </article>

          <section class="actions" aria-label="Student actions">
            <button class="action-card" type="button">
              <span class="action-icon" aria-hidden="true">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path d="M8 2v4"></path>
                  <path d="M16 2v4"></path>
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <path d="M3 10h18"></path>
                  <path d="m9 16 2 2 4-4"></path>
                </svg>
              </span>
              <span>
                <h3>Book a facility</h3>
                <p>Find available slots.</p>
              </span>
            </button>
            <button class="action-card" type="button">
              <span class="action-icon" aria-hidden="true">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path d="M8 6v6"></path>
                  <path d="M16 6v6"></path>
                  <path d="M6 18h.01"></path>
                  <path d="M18 18h.01"></path>
                  <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                  <path d="M4 13h16"></path>
                  <path d="M8 21v-2"></path>
                  <path d="M16 21v-2"></path>
                </svg>
              </span>
              <span>
                <h3>Live buses</h3>
                <p>Track campus routes.</p>
              </span>
            </button>
            <button class="action-card wide" type="button">
              <span class="action-icon" aria-hidden="true">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path d="M9 11 11 13 15 9"></path>
                  <path d="M20 6v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6"></path>
                  <path d="M3 6h18"></path>
                  <path d="M8 2v4"></path>
                  <path d="M16 2v4"></path>
                </svg>
              </span>
              <span>
                <h3>Attendance history</h3>
                <p>Review validated attendance records.</p>
              </span>
            </button>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const captions = {
      frosted: 'Frosted white cards: stronger translucent surfaces, soft shadow, no visible border.',
      brand: 'Brand-tinted cards: warmer maroon and gold surfaces with stronger separation from the background.',
      dimmer: 'Dimmer background: current card feel with quieter background glows behind the actions.'
    };
    const caption = document.querySelector('#modeCaption');
    const modeButtons = Array.from(document.querySelectorAll('[data-mode]'));
    const themeButtons = Array.from(document.querySelectorAll('[data-theme-value]'));

    modeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const mode = button.dataset.mode;
        root.dataset.mode = mode;
        caption.textContent = captions[mode];
        modeButtons.forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
        });
      });
    });

    themeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const theme = button.dataset.themeValue;
        root.dataset.theme = theme;
        themeButtons.forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
        });
      });
    });
  </script>
</body>
</html>
